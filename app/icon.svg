      <rect x="8" y="24" width="8" height="8" />
      <rect x="24" y="24" width="8" height="8" />
    </g>
  </g>

  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.5" fill="none" stroke="url(#s-grad)" stroke-opacity="0.5" stroke-width="1.5" />

  <text
    x="16"
